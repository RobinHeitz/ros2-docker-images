version: "3.8"
services:
  ros2-container:
    container_name: ros2-container-m1
    image: ros2-container-m1
    build: ./
    volumes:
      - ./ros_ws/src:/ros2_ws/src/
    environment:
      - DISPLAY=novnc:0.0
    networks:
      - x11
    stdin_open: true
    tty: true
  novnc:
    image: theasp/novnc:latest
    environment:
      - DISPLAY_WIDTH=2560
      - DISPLAY_HEIGHT=1300
    ports:
      - "8080:8080"
    networks:
      - x11
    restart: on-failure
networks:
  x11:
